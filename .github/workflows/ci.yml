name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    env:
      GOTOOLCHAIN: local
    strategy:
      matrix:
        go: ['1.26.x', '1.27.x']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: '**/go.sum'
      - run: make check-fmt
      - run: make vet test race coverage
      - run: ./scripts/modules.sh go build ./...
      - run: ./scripts/check-docs.sh
      - run: ./scripts/check-consumer.sh
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: '**/go.sum'
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: make staticcheck vuln
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: '**/go.sum'
      - run: make services
      - run: make integration
      - if: always()
        run: |
          docker compose -f integration/compose.yaml logs --no-color
          GPK_TLS_DIR="$PWD/integration/.runtime/certs" docker compose -f integration/extended-compose.yaml logs --no-color
      - if: always()
        run: make services-down
