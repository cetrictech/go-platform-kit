name: Release validation
on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Module directory (empty means every releasable module)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  required:
    uses: ./.github/workflows/ci.yml
  prepublication:
    needs: required
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: '**/go.sum'
      - run: ./scripts/install-api-tool.sh
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Run complete fail-closed release gate
        env:
          MODULE: ${{ inputs.module }}
        run: |
          if [[ -n "$MODULE" ]]; then
            ./scripts/release-check.sh --module "$MODULE"
          else
            ./scripts/release-check.sh
          fi
      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-validation-evidence
          path: .cache/release-evidence/
# Validation only. No workflow can publish or create tags with these permissions.
