name: Release validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: '**/go.sum'
      - run: make check-fmt vet test race
      - run: ./scripts/check-consumer.sh
      - run: ./scripts/check-docs.sh
      - run: git diff --exit-code
# Deliberately validates only. Tags and publishing require explicit maintainer action.
