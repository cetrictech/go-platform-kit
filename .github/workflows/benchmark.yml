name: Benchmarks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: '**/go.sum'
      - run: ./scripts/check-performance.sh
      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: benchmarks
          path: .cache/performance/
