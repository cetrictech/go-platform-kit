name: Benchmarks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: '**/go.sum'
      - run: make bench | tee benchmarks.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: benchmarks
          path: benchmarks.txt
