redpanda:
  data_directory: /var/lib/redpanda/data
  node_id: 0
  seed_servers: []
  developer_mode: true
  rpc_server:
    address: 0.0.0.0
    port: 33145
  advertised_rpc_api:
    address: redpanda-secure
    port: 33145
  kafka_api:
    - name: secure
      address: 0.0.0.0
      port: 29092
      authentication_method: sasl
  advertised_kafka_api:
    - name: secure
      address: 127.0.0.1
      port: 29092
  kafka_api_tls:
    - name: secure
      enabled: true
      cert_file: /tls/server.crt
      key_file: /tls/server.key
      truststore_file: /tls/ca.crt
      require_client_auth: true
  admin:
    - address: 0.0.0.0
      port: 9644
